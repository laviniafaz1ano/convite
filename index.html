<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavínia faz 1 ano</title>
<meta property="og:title" content="Lavínia faz 1 ano">
<meta property="og:description" content="Confirme sua presença.">
<style>
  html, body { height: 100%; margin: 0; background: #f3efe9; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p { margin: 0; padding: 2rem 1.5rem; font: 1rem/1.5 system-ui, sans-serif; color: #55484e; text-align: center; }
</style>
</head>
<body>
<script>
  // Cole entre as aspas o endereço do App da Web (o que termina em /exec)
  var LINK_DO_APP = 'https://script.google.com/macros/s/AKfycbwnc3FUOpFxP4L9KQ53xcB6kEz8OAMBuNn23a9G0EVRf1drG9a4owb07sN6iytSCsBT/exec';

  if (LINK_DO_APP.indexOf('https://script.google.com/') === 0) {
    var quadro = document.createElement('iframe');
    quadro.src = LINK_DO_APP;
    quadro.title = 'Confirmação de presença';
    document.body.appendChild(quadro);
  } else {
    var aviso = document.createElement('p');
    aviso.textContent = 'Falta colar o endereço do App da Web neste arquivo (linha LINK_DO_APP).';
    document.body.appendChild(aviso);
  }
</script>
</body>
</html>
